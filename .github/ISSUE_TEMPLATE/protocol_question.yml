name: Protocol question
description: A question about the feed protocol, or a gap or error in PROTOCOL.md.
labels: ["protocol"]
body:
  - type: markdown
    attributes:
      value: |
        Check PROTOCOL.md first, and the "Sports & bet types" section of
        https://magicmarkets.com/llms-full.txt for sport codes and bet_type grammar.
        Never paste a token, a password or a stream URL (it contains the token).

  - type: textarea
    id: question
    attributes:
      label: Question
      description: What do you want to know, or what looks wrong?
    validations:
      required: true

  - type: input
    id: section
    attributes:
      label: PROTOCOL.md section
      placeholder: "5.3 Handicap line encoding"

  - type: textarea
    id: sample
    attributes:
      label: Sample records
      description: Records or frames that show the behaviour. Frames do not contain tokens, but check before you paste.
      render: json

  - type: checkboxes
    id: checks
    attributes:
      label: Checklist
      options:
        - label: I searched existing issues and found no duplicate.
          required: true
        - label: I removed every token, password and stream URL from this report.
          required: true
